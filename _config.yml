# Standard Jekyll / GitHub Pages
url: "https://senegalais-amiens.fr" # Le domaine racine
baseurl: "/"                   # Le nom du dossier du projet

# Configuration de la langue (SEO)
lang: "fr_FR"
locale: "fr_FR"

# Informations SEO du site
title: "ASA - Association des Sénégalais d'Amiens"
description: "Site officiel de l'Association des Sénégalais d'Amiens (ASA)."

# Personnalisation des titres générés par jekyll-seo-tag
title_separator: "|"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag # plugin officiel SEO de GitHub Pages.


# Exclusion globale pour le plugin jekyll-sitemap
# Application de "sitemap: false" en masse
defaults:
  - scope:
      path: "documents" # Cible tout le contenu du dossier documents
    values:
      sitemap: false    # Exclut du sitemap


# 1. Déclaration de la collection "evenements"
collections:
  evenements:
    output: true                       # chaque fichier devient une page
    permalink: /evenements/:name/      # ex. fete-independance.md -> /evenements/fete-independance/

# 2. Layout appliqué automatiquement à tous les événements
#    (évite de répéter "layout: evenement" dans chaque fichier)
defaults:
  - scope:
      path: ""
      type: evenements
    values:
      layout: evenement
